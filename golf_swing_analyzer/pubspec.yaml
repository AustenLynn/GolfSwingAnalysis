name: golf_swing_analyzer
description: Personal golf swing analysis using ESP32 IMU and ML backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE
  flutter_blue_plus: ^1.31.15

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.3

  # Charts
  fl_chart: ^0.68.0

  # Navigation
  go_router: ^13.2.0

  # Local storage
  shared_preferences: ^2.2.3

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
